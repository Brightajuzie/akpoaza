name: FixMart CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Run Integration Tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: testing-dummy-secret

  frontend-ci:
    name: Frontend CI (Type Check & Export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Export Web Bundle
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://akpoaza-3.onrender.com/api
